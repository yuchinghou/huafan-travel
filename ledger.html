<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記帳工具</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --card2:#f0f3fa; --line:#e3e8f2;
  --fg:#2b3345; --mut:#8b95ab; --acc:#6c8cff; --ok:#2fbf83; --bad:#f26d6d; --warn:#f0a640; --aa:#9b7bff;
  --shadow:0 6px 24px rgba(80,100,160,.08), 0 1px 3px rgba(80,100,160,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:22px 18px 60px;max-width:1080px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin:10px 4px 16px}
header h1{font-size:22px;font-weight:800}
header h1 small{font-size:12px;color:var(--mut);font-weight:400;margin-left:8px}
.pills{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.pills button{border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer}
.pills button.on{background:var(--acc);color:#fff}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;font-weight:700;padding:9px 18px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
nav button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpiGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{background:var(--card2);border-radius:16px;padding:16px 18px}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.f{flex:1;min-width:140px}
.f label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.f input,.f select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--fg);outline:none}
.f input:focus,.f select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,140,255,.15)}
.btn{border:0;background:var(--acc);color:#fff;font-size:14px;font-weight:700;padding:10px 22px;border-radius:12px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.danger{background:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.tg-in{background:rgba(47,191,131,.12);color:var(--ok)}
.tg-out{background:rgba(242,109,109,.12);color:var(--bad)}
.tg-det{background:var(--card2);color:var(--mut)}
.tg-aa{background:rgba(155,123,255,.14);color:var(--aa)}
.tg-p{background:rgba(108,140,255,.12);color:var(--acc)}
.note{font-size:12px;color:var(--mut);line-height:1.7;background:var(--card2);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.syncstate{font-size:13px;font-weight:700;color:var(--ok);margin:-6px 0 10px}
.syncstate.warn{color:var(--bad)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.bar i.over{background:var(--bad)}
.who{display:flex;gap:10px}
.who button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
.who button.on{border-color:var(--acc);color:var(--acc);background:rgba(108,140,255,.07)}
footer{text-align:center;font-size:12px;color:var(--mut);margin-top:26px;line-height:1.7}
@media (max-width:640px){
  body{padding:14px 10px 48px}
  header h1{font-size:18px}
  nav{position:sticky;top:0;z-index:9;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
  nav button{white-space:nowrap;padding:8px 14px;font-size:13px}
  .grid2,.kpiGrid{grid-template-columns:1fr}
  .card{padding:16px 14px;border-radius:16px}
  table{font-size:12px}
  td,th{padding:6px 5px}
  .f input,.f select{font-size:16px}
  .pills button{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>
<header>
  <h1>💰 記帳工具 <small id="hdrInfo"></small></h1>
  <div class="pills">

function normTag(s){
  s=String(s||"").trim(); if(!s) return "";
  var segs=s.split("/"), top=segs[0];
  top=(TAG_ALIAS[top]!==undefined)?TAG_ALIAS[top]:top;
  if(!top||!TAG_TREE[top]) return "";
  if(segs[1]&&TAG_TREE[top].indexOf(segs[1])>=0) return top+"/"+segs[1];
  return top;
}
function defaults(){

}
function normOpening(d){
  var o={}, src=d.opening||{};
  (d.people||[]).forEach(function(p){
    var e=src[p.id];
    if(e&&typeof e==="object") o[p.id]={bank:+e.bank||0, stock:+e.stock||0};

  });

    if(k&&!o[k].bank&&!o[k].stock) o[k]={bank:+src.bank||0, stock:+src.stock||0};
  }
  return o;
}
function migrate(d){
  var base = defaults();

    goal: d.goal||{},

      return t;
    }),
    meta: d.meta||{}
  };
}

/* ================= 計算口徑（核心） =================
   計入總額：類別在「expense 清單(一般支出/旅遊支出)」或「income 清單(薪資/獎金現金)」
   其餘類別（刷卡消費、繳信用卡費、轉帳…）只留明細，一律不計入。 */
function isCounted(t){
  if(t.type==="expense") return S.cats.expense.indexOf(t.cat)>=0;
  if(t.type==="income")  return S.cats.income.indexOf(t.cat)>=0;
  return false;
}
var viewRange="month";
function viewMonthNow(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
var viewMonth=viewMonthNow();
function setRange(r){ viewRange=r; render(); }
function txOfRange(){
  return S.txns.filter(function(t){
    if(viewRange==="all") return true;
    if(viewRange==="month") return t.date.slice(0,7)===viewMonth;
    return t.date.slice(0,4)===viewMonth.slice(0,4);
  });
}
function rangeLabel(){
  if(viewRange==="month") return viewMonth.replace("-","/")+" 當月";
  if(viewRange==="year")  return viewMonth.slice(0,4)+" 年度累計";
  return "全期間累計";
}
function rangeMonths(){
  if(viewRange==="month") return 1;
  var cnt=0, mo={};
  S.txns.forEach(function(t){ if(isCounted(t)) mo[t.date.slice(0,7)]=1; });
  if(viewRange==="all"){ var k=Object.keys(mo); return Math.max(1,k.length); }
  var y=viewMonth.slice(0,4);
  for(var m=1;m<=12;m++){ if(mo[y+"-"+String(m).padStart(2,"0")]) cnt++; }
  return Math.max(1,cnt);
}
function sumCounted(list, type){ var s=0; list.forEach(function(t){ if(t.type===type&&isCounted(t)) s+=t.amount; }); return s; }
function sumDetail(list){ var s=0; list.forEach(function(t){ if(!isCounted(t)&&t.type!=="income") s+=t.amount; }); return s; }
function personName(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i].name; return "?"; }
function fmt(n){ return Math.round(n).toLocaleString("zh-TW"); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function monthLabelOf(t){ return t.date.slice(0,7); }
var rpMode="m", rpStart="", rpEnd="";
function monthsBetween(a,b){
  if(!a||!b){return [];}
  if(a>b){var t=a;a=b;b=t;}
  var out=[],y=+a.slice(0,4),m=+a.slice(5,7),ey=+b.slice(0,4),em=+b.slice(5,7);
  while(y<ey||(y===ey&&m<=em)){ out.push(y+"-"+("0"+m).slice(-2)); m++; if(m>12){m=1;y++;} }
  return out;
}
function rpRange(){
  var mo=(document.getElementById("monthSel")||{}).value||viewMonth;
  if(rpMode==="m")return [mo];
  if(rpMode==="y"){var arr=[],y=mo.slice(0,4);for(var i2=1;i2<=12;i2++)arr.push(y+"-"+("0"+i2).slice(-2));return arr;}
  return monthsBetween(rpStart||mo.slice(0,4)+"-01", rpEnd||mo);
}

/* ================= 雲端同步（GitHub Private Repo） ================= */
var CS_CFG_KEY = "householdLedger.sync";
var CS = {
  cfg: (function(){ try{ return JSON.parse(localStorage.getItem(CS_CFG_KEY)) || {repo:"yuchinghou/-",file:"data.json",token:""}; }catch(e){ return {}; } })(),
  sha: null, busy: false, again: false, timer: null,
  api: function(){ return "https://api.github.com/repos/" + this.cfg.repo; },
  on: function(){ return !!(this.cfg.repo && this.cfg.token); },
  save: function(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); this.schedule(); },
  schedule: function(){ var self=this; if(!this.on())return; clearTimeout(this.timer); this.timer=setTimeout(function(){ self.syncNow(); },1200); },
  status: function(msg, warn){ var el=document.getElementById("syncState"); if(el){ el.textContent=msg; el.className="syncstate"+(warn?" warn":""); } },
  syncNow: function(){ var self=this; if(!this.on())return;
    if(this.busy){ this.again=true; return; }
    this.busy=true; this.status("同步中…");
    this.pull().then(function(){ self.busy=false; if(self.again){ self.again=false; self.schedule(); } })
      .catch(function(e){ self.busy=false; self.status("⚠ 同步失敗，資料已先存本機："+e.message, true); });
  },
  pull: function(){ if(!this.on())return Promise.resolve(); var self=this;
    return fetch(this.api()+"/contents/"+this.cfg.file+"?t="+Date.now(), {headers:{Authorization:"token "+this.cfg.token}})
      .then(function(r){ if(r.status===404) return {sha:null, content:null}; if(!r.ok) throw new Error("讀取雲端 HTTP "+r.status); return r.json(); })
      .then(function(meta){ var remote=null;
        if(meta.content){ try{ remote=migrate(JSON.parse(CS._unb64(meta.content.replace(/\s/g,"")))); }catch(e){} }
        self.sha=meta.sha||null;
        var merged=self.merge(S, remote);
        var same = remote && JSON.stringify(remote)===JSON.stringify(merged);
        S=merged; localStorage.setItem(LS_KEY, JSON.stringify(S));
        render();
        if(!same) return self.push();
      });
  },
  push: function(){ if(!this.on())return Promise.resolve(); var self=this;
    S.meta=S.meta||{}; S.meta.updatedAt=Date.now();
    var payload={ content: this._b64(JSON.stringify(S)), message:"記帳同步 "+new Date().toISOString().slice(0,16).replace("T"," ") };
    if(this.sha) payload.sha=this.sha;
    return fetch(this.api()+"/contents/"+this.cfg.file, { method:"PUT",
        headers:{Authorization:"token "+this.cfg.token, "Content-Type":"application/vnd.github+json"},
        body: JSON.stringify(payload) })
      .then(function(r){ if(!r.ok) throw new Error("上傳雲端 HTTP "+r.status); return r.json(); })
      .then(function(j){ try{ self.sha=j.content.sha; }catch(e){}
        self.status("✔ 已同步 · "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})+"（雲端為兩人共用資料）"); });
  },
  merge: function(local, remote){
    if(!remote) return local;
    var lt=local.txns.length, rt=remote.txns.length;
    var lu=(local.meta&&local.meta.updatedAt)||0, ru=(remote.meta&&remote.meta.updatedAt)||0;
    var base=(lt>rt||(lt===rt&&lu>=ru))?local:remote, other=(base===local)?remote:local;
    var seen={}; base.txns=base.txns.filter(function(t){ if(seen[t.id])return false; seen[t.id]=1; return true; });
    other.txns.forEach(function(t){ if(!seen[t.id]){ seen[t.id]=1; base.txns.push(t); } });
    base.txns.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    ["expense","income","detail"].forEach(function(k){
      var arr=(base.cats[k]||[]).slice();
      ((other.cats&&other.cats[k])||[]).forEach(function(c){ if(arr.indexOf(c)<0) arr.push(c); });
      base.cats[k]=arr;
    });
    var b={}; Object.keys(other.budgets||{}).forEach(function(k){ b[k]=other.budgets[k]; });
    Object.keys(base.budgets||{}).forEach(function(k){ b[k]=base.budgets[k]; });
    base.budgets=b;
    if(((other.meta&&other.meta.updatedAt)||0)>((base.meta&&base.meta.updatedAt)||0)){
      base.opening=other.opening; base.people=other.people;
    }
    base.meta.updatedAt=Math.max(lu,ru);
    return base;
  },
  _b64: function(s){ return btoa(unescape(encodeURIComponent(s))); },
  _unb64: function(s){ return decodeURIComponent(escape(atob(s))); },
  applyCfg: function(){
    this.cfg.repo=(document.getElementById("csRepo").value||"").trim();
    this.cfg.token=(document.getElementById("csToken").value||"").trim();
    this.cfg.file=(document.getElementById("csFile").value||"").trim()||"data.json";
    localStorage.setItem(CS_CFG_KEY, JSON.stringify(this.cfg));
    this.sha=null;
    if(this.on()){ this.status("首次連線，正在與雲端合併…"); this.syncNow(); }
    else this.status("未設定 → 只用本機（這台裝置自己記，離線可用）", true);
    var self=this; setTimeout(function(){ try{ render(); }catch(e){} }, 800);
  },
  syncCard: function(){
    var st = this.on() ? "☁ 雲端同步已開啟（"+esc(this.cfg.repo)+"）" : "未設定 → 只用本機（這台裝置自己記，離線可用）";
    var v=this.cfg;
    return '<div class="card"><h2>☁ 雲端同步（兩人共用這一個網頁）</h2>'+
      '<div class="syncstate" id="syncState">'+st+'</div>'+
      '<div class="note">用法：本檔上傳到任一網頁空間（例：GitHub Pages），手機電腦都開同一條網址。<b>兩人在下面各貼一次 Repo＋Token，記帳就即時同步到同一個 Private Repo 的 data.json</b>——一邊記一筆，另一邊打開就是同一本帳。離線也能記，上線自動補同步。<br>Token 申請：GitHub → Settings → Developer settings → Fine-grained tokens，只勾帳本那一個 Repo、權限 Contents: Read and write。</div>'+
      '<div class="row">'+
      '<div class="f"><label>Repo（帳號/庫名，例 yuchinghou/famledger）</label><input id="csRepo" placeholder="帳號/庫名" value="'+esc(v.repo||"")+'"></div>'+
      '<div class="f"><label>Token（Fine-grained PAT，只需 Contents 讀寫）</label><input id="csToken" type="password" placeholder="github_pat_…" value="'+esc(v.token||"")+'"></div>'+
      '<div class="f"><label>檔案路徑</label><input id="csFile" value="'+esc(v.file||"data.json")+'"></div>'+
      '</div>'+
      '<button class="btn" onclick="CS.applyCfg()">儲存設定並立即同步</button> '+
      '<button class="btn ghost" onclick="CS.syncNow()">現在同步一次</button>'+
      '</div>';
  }
};

function render(){
  document.getElementById("nav").innerHTML=PAGES.map(function(p){return '<button class="'+(p.id===cur?"on":"")+'" onclick="go(\''+p.id+'\')">'+p.label+'</button>';}).join("");
  document.getElementById("hdrInfo").textContent=rangeLabel();
  document.getElementById("rgMonth").className=viewRange==="month"?"on":"";
  document.getElementById("rgYear").className=viewRange==="year"?"on":"";
  document.getElementById("rgAll").className=viewRange==="all"?"on":"";
  var fn={dash:pages_dash,entry:pages_entry,list:pages_list,report:pages_report,budget:pages_budget,asset:pages_asset,aa:pages_aa,data:pages_data}[cur];
  document.getElementById("main").innerHTML=fn();
  if(cur==="entry") catOpts();
}
function boot(){
  S.meta=S.meta||{};
  render();
  if(CS.on()){ CS.status("抓雲端資料…"); CS.syncNow(); }
  setInterval(function(){ if(!document.hidden && CS.on()) CS.syncNow(); }, 30000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && CS.on()) CS.syncNow(); });
}
boot();
</script>
